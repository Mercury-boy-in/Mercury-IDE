<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercury IDE 1  - Update Awaiting</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #090c06 url('bg.png') center center / cover no-repeat fixed;
            color: #dddddd;
            font-family: 'Bahnschrift', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(5, 8, 3, 0.35), rgba(5, 8, 3, 0.72));
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            background-color: rgba(18, 20, 16, 0.82);
            backdrop-filter: blur(8px);
            padding: 40px 32px;
            border-radius: 14px;
            border: 1px solid rgba(118, 185, 0, 0.45);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(118, 185, 0, 0.15);
            max-width: 560px;
            width: 100%;
        }
        h1 {
            color: #8ce600;
            font-size: 2.6em;
            margin: 0 0 10px 0;
            font-family: 'Consolas', monospace;
            letter-spacing: 3px;
            text-shadow: 0 0 14px rgba(118, 185, 0, 0.45);
        }
        p {
            font-size: 1.08em;
            margin-bottom: 32px;
            color: #cccccc;
        }
        .countdown {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 36px;
        }
        .time-box {
            background-color: rgba(8, 10, 6, 0.9);
            padding: 14px 10px;
            border-radius: 8px;
            border: 1px solid #2b3818;
            min-width: 78px;
        }
        .time-box span {
            display: block;
            font-size: 2.3em;
            color: #ffffff;
            font-weight: bold;
            font-family: 'Consolas', monospace;
        }
        .time-box label {
            font-size: 0.78em;
            color: #8ce600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            display: inline-block;
            background-color: transparent;
            color: #8ce600;
            border: 2px solid #8ce600;
            padding: 12px 26px;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
            font-size: 1.05em;
            transition: all 0.2s ease-in-out;
        }
        .btn:hover {
            background-color: #8ce600;
            color: #050505;
            box-shadow: 0 0 18px rgba(140, 230, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h1>MERCURY IDE 1 </h1>
        <p>The next major environment update drops on <strong>November 30th</strong>. Stand by.</p>

        <div class="countdown" id="countdown">
            <div class="time-box"><span id="days">00</span><label>Days</label></div>
            <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
            <div class="time-box"><span id="minutes">00</span><label>Mins</label></div>
            <div class="time-box"><span id="seconds">00</span><label>Secs</label></div>
        </div>

        <a href="https://github.com/Mercury-boy-in/Mercury-IDE" class="btn">Return to Repository</a>
    </div>

    <script>
        const targetDate = new Date("Nov 30, 2026 00:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "<h2 style='color: #8ce600; font-family: Consolas;'>UPDATE IS LIVE</h2>";
                return;
            }

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
